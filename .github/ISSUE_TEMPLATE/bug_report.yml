name: Bug report
description: Something isn't working as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command you ran and the output. Remove anything private.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `todo-age --version`
