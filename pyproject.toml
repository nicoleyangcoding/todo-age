[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "todo-age"
version = "0.1.0"
description = "List every TODO, FIXME and HACK in a git repo, oldest first, using git blame."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicole Yang" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["todo", "fixme", "technical debt", "git", "git blame", "code quality", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/nicoleyangcoding/todo-age"
Issues = "https://github.com/nicoleyangcoding/todo-age/issues"
Changelog = "https://github.com/nicoleyangcoding/todo-age/blob/main/CHANGELOG.md"

[project.scripts]
todo-age = "todo_age.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/todo_age"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
