name: todo-age report
description: List the oldest TODO, FIXME and HACK comments in the job summary, dated with git blame.
author: Nicole Yang
branding:
  icon: clock
  color: orange

inputs:
  limit:
    description: How many markers to show.
    default: "20"
  older-than:
    description: Only show markers older than this age (for example 90d, 6m, 1y).
    default: ""
  tags:
    description: Comma-separated markers to look for.
    default: "TODO,FIXME,HACK,XXX"
  fail-if-older-than:
    description: Fail the step if any marker is older than this age.
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install todo-age
      shell: bash
      run: python -m pip install --quiet "$ACTION_PATH"
      env:
        ACTION_PATH: ${{ github.action_path }}
    - name: Report
      shell: bash
      env:
        LIMIT: ${{ inputs.limit }}
        OLDER_THAN: ${{ inputs.older-than }}
        TAGS: ${{ inputs.tags }}
        FAIL_AGE: ${{ inputs.fail-if-older-than }}
        REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::warning::Shallow clone detected. Set fetch-depth: 0 on actions/checkout for accurate ages."
        fi
        args=(--format markdown --repo-url "$REPO_URL" --tags "$TAGS" --limit "$LIMIT")
        [ -n "$OLDER_THAN" ] && args+=(--older-than "$OLDER_THAN")
        [ -n "$FAIL_AGE" ] && args+=(--fail-if-older-than "$FAIL_AGE")
        { echo "## Oldest TODOs"; echo; todo-age "${args[@]}"; } >> "$GITHUB_STEP_SUMMARY"
